# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "736e6779059b8e0faced2b8524120c7c"
name = "backyard-designer-app"
# Replace this host with your production app URL before running `shopify app deploy`.
# The examples use a Render service named "backyard-designer" (see README > Deployment).
application_url = "https://backyard-designer.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products"

[app_proxy]
url = "/proxy/designer"
prefix = "apps"
subpath = "backyard-designer"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [
  "https://backyard-designer.onrender.com/auth/callback",
  "https://backyard-designer.onrender.com/auth/shopify/callback",
  "https://backyard-designer.onrender.com/api/auth/callback"
]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
