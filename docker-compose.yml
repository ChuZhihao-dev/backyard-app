services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backyard
      POSTGRES_PASSWORD: backyard
      POSTGRES_DB: backyard
    ports:
      - "5432:5432"
    volumes:
      - backyard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backyard -d backyard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backyard-pgdata:
